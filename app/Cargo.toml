[package]
name = "noir-music"
version = "0.1.0"
edition = "2024"
description = "Noir Music: seus amigos ouvem a mesma música que você, escolhem e põem na fila"

[[bin]]
name = "NoirMusic"
path = "src/main.rs"

[dependencies]
noir-music-net = { path = "../net" }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
audiopus = "0.2"
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
