name: Windows

# Compila o Noir Music pro Windows (quem ouve) e publica o zip na release "windows"
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release -p noir-music

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory NoirMusic | Out-Null
          Copy-Item target\release\NoirMusic.exe NoirMusic\
          Copy-Item app\assets\OFL-Inter.txt NoirMusic\
          Copy-Item app\assets\Phosphor-LICENSE.txt NoirMusic\
          Compress-Archive NoirMusic\* NoirMusic-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NoirMusic-Windows
          path: NoirMusic-Windows.zip

      - name: Publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows -R ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create windows -R ${{ github.repository }} --title "Noir Music para Windows" --notes "Baixe o zip, extraia e abra o NoirMusic.exe." }
          gh release upload windows NoirMusic-Windows.zip -R ${{ github.repository }} --clobber
