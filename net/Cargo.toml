[package]
name = "jam-net"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
str0m = "0.24.1"
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
if-addrs = "0.15"
rand = "0.9"
socket2 = { version = "0.6", features = ["all"] }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio", "ipv6"] }
sha1 = "0.11"
md-5 = "0.11"
